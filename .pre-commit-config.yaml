# Pre-commit hooks — enforce lint/format/syntax checks before every commit.
#
# One-time install (per machine):
#   pip install pre-commit
#   pre-commit install
#
# Manual run (all files):
#   pre-commit run --all-files
#
# Bypass (emergency only — must justify in commit body):
#   git commit --no-verify
# But: `--no-verify` is in the deny-list of .claude/settings.json, so the
# agent cannot use it. That's by design.

repos:
  # ── Generic hygiene ──────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$|\.diff$'
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: check-yaml
      - id: check-json
        exclude: '^\.vscode/'
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: '\.ps1$'  # PowerShell scripts keep CRLF

  # ── Python — Ruff (lint + format) ────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        files: '^(app|tests)/'
      - id: ruff-format
        files: '^(app|tests)/'

  # ── Python — mypy, attr-defined subset ───────────────────────────────────
  # Full mypy sits at ~148 errors, so gating on it would block every commit
  # that touches app/. `attr-defined` is the subset that is at 0 and worth
  # holding there: it catches "this method does not exist on this object" —
  # the class of bug that shipped db.get_tracks, db.save_track_cues,
  # db.save_xml and db.load_xml, each a guaranteed HTTP 500. Mirrors the
  # "Type-check — no missing attributes" step in .github/workflows/ci.yml.
  - repo: local
    hooks:
      - id: mypy-attr-defined
        name: mypy — no missing attributes (attr-defined)
        entry: python scripts/check_attr_defined.py
        language: system
        pass_filenames: false
        files: '^app/.*\.py$'

  # ── Rust — fmt check ─────────────────────────────────────────────────────
  # Runs `cargo fmt --check` against src-tauri/. Doesn't auto-fix to keep the
  # commit deterministic; user re-runs `cargo fmt` if it fails.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --manifest-path src-tauri/Cargo.toml --check
        language: system
        files: '^src-tauri/.*\.rs$'
        pass_filenames: false

  # ── JS/JSX — Prettier + ESLint ───────────────────────────────────────────
  - repo: local
    hooks:
      - id: prettier-frontend
        name: prettier (frontend)
        entry: npx --no-install prettier --write
        language: system
        files: '^frontend/src/.*\.(js|jsx|mjs|cjs|json|css)$'
      - id: eslint-frontend
        name: eslint (frontend)
        entry: npx --no-install eslint --fix
        language: system
        files: '^frontend/src/.*\.(js|jsx)$'

  # ── Research-pipeline doc structure ──────────────────────────────────────
  # Catches drift in `docs/research/`: filename / state / folder mismatch,
  # frontmatter slug !== filename slug, Lifecycle latest state !== filename
  # state (rename without lifecycle update), missing Lifecycle. Warnings
  # (legacy missing Original Idea) print but don't block.
  - repo: local
    hooks:
      - id: validate-research-docs
        name: validate research-pipeline doc structure
        entry: python scripts/validate_research_docs.py
        language: system
        files: '^docs/research/(research|implement|archived)/.*\.md$'

  # ── Routine prompt sanity ────────────────────────────────────────────────
  # Every routine prompt file must have a `---` divider so
  # scripts/print_routine.py can split header from prompt.
  - repo: local
    hooks:
      - id: routine-divider-check
        name: routine prompts have a `---` divider
        entry: python scripts/print_routine.py --check
        language: system
        files: '^docs/research/routines/.*\.md$'
        pass_filenames: false

  # ── Forbid secrets / large user data ─────────────────────────────────────
  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid .env in staged changes
        entry: 'bash -c "git diff --cached --name-only | grep -E ''(^|/)\\.env($|\\.)'' && exit 1 || exit 0"'
        language: system
        pass_filenames: false
      - id: forbid-master-db
        name: forbid master.db in staged changes
        entry: 'bash -c "git diff --cached --name-only | grep -E ''master\\.db'' && exit 1 || exit 0"'
        language: system
        pass_filenames: false
