# Pre-commit hooks — enforce lint/format/syntax checks before every commit.
#
# One-time install (per machine):
#   pip install pre-commit
#   pre-commit install
#
# Manual run (all files):
#   pre-commit run --all-files
#
# Bypass (emergency only — must justify in commit body):
#   git commit --no-verify
# But: `--no-verify` is in the deny-list of .claude/settings.json, so the
# agent cannot use it. That's by design.

repos:
  # ── Generic hygiene ──────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$|\.diff$'
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: check-yaml
      - id: check-json
        exclude: '^\.vscode/'
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: '\.ps1$'  # PowerShell scripts keep CRLF

  # ── Python — Ruff (lint + format) ────────────────────────────────────────
  # The 19 codes below are pre-existing debt (149 findings, 87 of them in
  # app/main.py alone). Gating on them made every commit that touches
  # app/main.py impossible — the same reason ci.yml runs `ruff check ... ||
  # true`. Same idea as the mypy-attr-defined hook: hold the line where the
  # count is already 0 instead of gating on a number nobody can pay down in
  # one commit. Cross off a code here as its findings reach 0; when the list
  # is empty, delete --ignore and the hook is fully strict again.
  #   B007 B019 B904 B905 E402 E741 F401 F811 F841 RUF001 RUF002 RUF003
  #   RUF012 SIM102 SIM105 SIM113 SIM117 UP035 UP038
  # RUF100 rides along: ignoring a code turns its existing `# noqa` into an
  # "unused noqa" (36 of them). It comes off with the last code above.
  # NOTE: --fix stays off. It rewrote unrelated lines in staged files
  # (a `zip(..., strict=False)` inside safe_compare), which silently widens
  # a commit's diff beyond what was reviewed.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args:
          - "--ignore=B007,B019,B904,B905,E402,E741,F401,F811,F841,RUF001,RUF002,RUF003,RUF012,RUF100,SIM102,SIM105,SIM113,SIM117,UP035,UP038"
        files: '^(app|tests)/'
      # WARNING: v0.8.6's formatter disagrees with newer ruff on 14 files
      # (app/{folder_watcher,services,usb_pdb}.py + 11 tests/). The tree is
      # formatted with the version the format-on-edit hook runs (0.15.x), so
      # staging one of those files reformats it here and back on the next
      # edit. Bump `rev` to the ruff you develop against to stop the churn —
      # ci.yml installs ruff unpinned, i.e. always the newest.
      - id: ruff-format
        files: '^(app|tests)/'

  # ── Python — mypy, attr-defined subset ───────────────────────────────────
  # Full mypy sits at ~148 errors, so gating on it would block every commit
  # that touches app/. `attr-defined` is the subset that is at 0 and worth
  # holding there: it catches "this method does not exist on this object" —
  # the class of bug that shipped db.get_tracks, db.save_track_cues,
  # db.save_xml and db.load_xml, each a guaranteed HTTP 500. Mirrors the
  # "Type-check — no missing attributes" step in .github/workflows/ci.yml.
  - repo: local
    hooks:
      - id: mypy-attr-defined
        name: mypy — no missing attributes (attr-defined)
        entry: python scripts/check_attr_defined.py
        language: system
        pass_filenames: false
        files: '^app/.*\.py$'

  # ── Rust — fmt check ─────────────────────────────────────────────────────
  # Runs `cargo fmt --check` against src-tauri/. Doesn't auto-fix to keep the
  # commit deterministic; user re-runs `cargo fmt` if it fails.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --manifest-path src-tauri/Cargo.toml --check
        language: system
        files: '^src-tauri/.*\.rs$'
        pass_filenames: false

  # ── JS/JSX — Prettier + ESLint ───────────────────────────────────────────
  # `npx` resolved against the REPO ROOT, which has neither tool installed
  # (both live in frontend/node_modules), so npx tried to fetch them and
  # pre-commit aborted with "npx canceled due to missing packages" — every
  # commit touching frontend/src hit it. Call the real entry points through
  # node instead: portable across shells and it never reaches the network.
  - repo: local
    hooks:
      - id: prettier-frontend
        name: prettier (frontend)
        entry: node frontend/node_modules/prettier/bin/prettier.cjs --write
        language: system
        files: '^frontend/src/.*\.(js|jsx|mjs|cjs|json|css)$'
      - id: eslint-frontend
        name: eslint (frontend)
        entry: node frontend/node_modules/eslint/bin/eslint.js --fix
        language: system
        files: '^frontend/src/.*\.(js|jsx)$'

  # ── Research-pipeline doc structure ──────────────────────────────────────
  # Catches drift in `docs/research/`: filename / state / folder mismatch,
  # frontmatter slug !== filename slug, Lifecycle latest state !== filename
  # state (rename without lifecycle update), missing Lifecycle. Warnings
  # (legacy missing Original Idea) print but don't block.
  - repo: local
    hooks:
      - id: validate-research-docs
        name: validate research-pipeline doc structure
        entry: python scripts/validate_research_docs.py
        language: system
        files: '^docs/research/(research|implement|archived)/.*\.md$'

  # ── Routine prompt sanity ────────────────────────────────────────────────
  # Every routine prompt file must have a `---` divider so
  # scripts/print_routine.py can split header from prompt.
  - repo: local
    hooks:
      - id: routine-divider-check
        name: routine prompts have a `---` divider
        entry: python scripts/print_routine.py --check
        language: system
        files: '^docs/research/routines/.*\.md$'
        pass_filenames: false

  # ── Forbid secrets / large user data ─────────────────────────────────────
  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid .env in staged changes
        entry: 'bash -c "git diff --cached --name-only | grep -E ''(^|/)\\.env($|\\.)'' && exit 1 || exit 0"'
        language: system
        pass_filenames: false
      - id: forbid-master-db
        name: forbid master.db in staged changes
        entry: 'bash -c "git diff --cached --name-only | grep -E ''master\\.db'' && exit 1 || exit 0"'
        language: system
        pass_filenames: false
