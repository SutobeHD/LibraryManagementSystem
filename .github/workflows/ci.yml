name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref — saves minutes on rebase-heavy PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint-test:
    name: Python — ruff + mypy + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # Pinned, same as .pre-commit-config.yaml. The ruff/mypy steps below
          # are blocking now, so an unpinned install would let an upstream
          # release turn CI red with no change to this repo — and would let the
          # pre-commit hook disagree with CI about what "clean" means.
          # Bump both files together, in one commit, after re-clearing the gate.
          pip install ruff==0.15.8 mypy==1.19.1 httpx
          # Backend deps come straight from requirements.txt, minus the heavy
          # native deps (madmom, essentia, pyrekordbox) that aren't
          # pip-resolvable on Linux runners — those get `ignore_missing_imports`
          # in mypy + per-file skips in pytest. Deriving the list from
          # requirements.txt keeps CI in sync automatically; the old
          # hand-maintained list silently drifted (platformdirs / watchdog /
          # python-multipart gaps).
          grep -vE '^\s*(#|$)' requirements.txt \
            | grep -vE '^(madmom|essentia|pyrekordbox)==' \
            | pip install -r /dev/stdin

      # All three gates below are blocking. They were `|| true` until the
      # baseline reached zero — see docs/QUALITY_GATES.md for the numbers and
      # what was found on the way. Do not re-add `|| true`: fix the finding,
      # or record the exemption in the tool's own config with a reason.
      #
      # Ruff is invoked on `.`, NOT on `app/ tests/ scripts/`. Passing several
      # paths silently drops some of them: `ruff format --check app tests` sees
      # 108 files, `tests app` sees 55 — the same tree, one argument order
      # apart. `app/ tests/ scripts/` checked 65 of 118 and reported success.
      # A single root path also covers backend_entry.py and .claude/hooks/,
      # which no invocation ever reached; scope is governed by
      # `extend-exclude` in pyproject.toml.
      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type-check with mypy
        run: mypy app/

      - name: Run pytest
        run: pytest tests/ -v --tb=short   # 730 passed / 1 skipped at time of writing

      - name: Check MAP.md / MAP_L2.md drift
        run: python scripts/regen_maps.py --check   # pure AST/regex, no runtime deps — regen via scripts/regen_maps.py

  rust-lint-test:
    name: Rust — clippy + cargo test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Stub Tauri sidecar binary
        # `src-tauri/build.rs` resolves the bundled Python sidecar before
        # compilation. CI doesn't build the sidecar (huge, separate
        # pipeline) so we drop a zero-byte placeholder. clippy + check
        # don't read it; bundling does, but that happens in the release
        # workflow, not here.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/binaries/RB_Backend-x86_64-pc-windows-msvc.exe | Out-Null

      - name: Rustfmt
        # Blocking. `cargo fmt --check` needs no build, so unlike clippy it can
        # be verified on any platform. Baseline cleared — see
        # docs/QUALITY_GATES.md.
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        # STILL NON-BLOCKING — the only gate in this repo that is.
        # Not for lack of will: clippy needs a full build, and the Tauri build
        # pulls gdk-3.0 / webkit2gtk, which are Windows-runner-only here. That
        # makes the warning list unverifiable outside CI itself, so nobody can
        # clear it before flipping the switch. First person with a Windows
        # checkout: run the command below, fix what it prints, drop the
        # `|| true`, and add `-- -D warnings`.
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features || true

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --no-fail-fast

  frontend-lint:
    name: Frontend — eslint + prettier + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix frontend

      # Blocking. `npm run lint` runs eslint with --max-warnings=0, so a new
      # warning fails the build — see docs/QUALITY_GATES.md.
      - name: ESLint
        run: npm run lint --prefix frontend

      - name: Prettier check
        run: npm run format:check --prefix frontend

      - name: Build (smoke)
        run: npm run build --prefix frontend
