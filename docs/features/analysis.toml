[area]
id = "analysis"
name = "Audio-Analyse"
order = 4
desc = "Offline-DSP (Python): BPM, Key, Beatgrid, Cues, Waveforms; Matching und Klassifikation von Tracks."

# ── DSP-Engine ────────────────────────────────────────────────────────────

[[feature]]
id = "analysis-engine"
group = "DSP-Engine"
name = "Analyse-Engine BPM/Key/Beatgrid"
