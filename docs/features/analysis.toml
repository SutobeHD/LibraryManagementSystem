# ── DSP-Engine ────────────────────────────────────────────────────────────

[[feature]]
id = "analysis-engine"
group = "DSP-Engine"
name = "Analyse-Engine BPM/Key/Beatgrid"
status = "shipped"
test = "testen"
desc = "madmom-RNN-Beats mit Oktav-Prior, essentia-Key, Downbeat, Tempo-Wechsel, LUFS/ReplayGain, Genre-Hint."
paths = ["app/analysis_engine.py"]
depends_on = ["analysis-settings", "analysis-cache"]
related = ["genre-definition-schema"]
todo = ["Key nur 2/8 exakt gleich Rekordbox; essentia in .venv/Bundle nicht installiert -> K-S-Fallback", "Tempo-Anker (detect_tempo_changes, librosa) passen nicht zum gleichmäßigen Grid; XML-Export setzt den Anker bei 0.0 (Inizio=0) -> Grid-Phase falsch. Bei grid_mode uniform einen Anker am Downbeat schreiben (wie rekordbox_export.py)", "Noch nicht identisch: 44322639 (148,15), 90129674 (135,21), 203290237 (RB 127,99), 126178621 (RB 204,74); engeres Kamm-Band (0,06) würde zwei davon fixen, gefährdet aber 59837644", "War Cry (179714711) liegt einen halben Beat neben Rekordbox; Phasen-Regel trennt ihn nicht von Heimweh (218275929), wo Rekordbox mit uns übereinstimmt"]
notes = "MP3-Grid gefixt (fix/mp3-encoder-delay, 2026-11-23) - neu prüfen: get_encoder_delay nimmt für MP3 denselben Vorlauf wie die Waveform (mp3_lead_in_s aus dem Frame-Header: 0 / 25,1 / 51,2 ms für kein Info-Frame / Info / Info+LAME) statt fix 22,5 ms. A/B 18 MP3 (je 6 pro Header-Typ) gegen Rekordbox: Grid-Median 24,3 -> 5,2 ms; Versatz (wir minus RB) ohne Info +25 -> +2,5 ms, LAME -24,5 -> +4 ms, Info +2 -> +4,5 ms. Rest +2..5 ms spät in allen Klassen kommt vom Detektor, nicht vom Header. Analyse-Cache Version 7. B5 gefixt: BPM aus einer Regressionsgeraden über alle Beats (statt Median-Abstand im 10-ms-Raster), ganze Zahl nur bei <=0,05 BPM und <=10 ms Drift; stabile Tracks bekommen ein gleichmäßiges Grid wie Rekordbox (grid_mode uniform), schwankende behalten die erkannten Beats. A/B 2026-11-21 an 11 echten Tracks gegen Rekordbox: BPM exakt 1/11 -> 8/11, Grid-Abweichung Median 13,0 -> 9,7 ms. Analyse-Cache auf Version 4. Unruhige Tracks (fix/bpm-unsteady-tracks, 2026-11-22): Kamm-Fit, wenn der Tracker in Break/Intro verrutscht; Phasen-Check gegen den Kick (nur ab Verhältnis 2,0); .m4a ohne 47,9-ms-Delay. A/B 49 Tracks: BPM identisch 32 -> 46, Grid-Median 11,3 -> 4,9 ms, Mittel 36,1 -> 25,8 ms; Razor 210 -> 20 ms; kein Treffer verloren."

