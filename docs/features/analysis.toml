notes = "ANLZ0000.3EX ist kein ANLZ-Container (Kopf 81 A9 65 6D statt PMAI), sondern MessagePack {embedding: {d4..}} - ein Rekordbox-eigenes ML-Embedding (geprüft 2026-11-23 an 200 Dateien). Nicht nachbaubar; wir schreiben es nicht, die alte Datei bleibt liegen. Fix 2026-11-23 (fix/api-route-hygiene) - neu prüfen: /api/audio/analyze geht durch validate_audio_path (403 außerhalb, 400 falsche Endung, 404 fehlt); analyze-batch-NDJSON und analyze-full-ok-Antwort ohne Pfade (anlz_paths -> anlz_files, Fehlertext = feste Meldung je reason). PC-Test 2026-11-22 (Kopie der Library, main f3ce85d): analyze-full (force/skip/404), analyze-batch NDJSON + 409 Single-Flight, /api/audio/analyze async; Key in Camelot, .bak-Sicherungen. B6 nur per Unit-Test. Kein Frontend ruft die Routen. Schreibt unter db_lock analysed=105 + Key in Rekordbox-Schreibweise (Am, Dbm, F#); ein abgelehnter master.db-Write ist db_update_failed -> 500, nie still ok (B6, fix/kernloop-0.1-bugs). Kern-Loop-Test 2026-11-14 (Stand PR #60 a71bfa7, Library-Kopie): B6 (analyze-full meldete ok trotz gescheitertem master.db-Write) in PR #82 gefixt - neu prüfen."

