[[feature]]
id = "waveform-generation"
group = "DSP-Engine"
name = "ANLZ-Waveforms erzeugen"
status = "partial"
test = "testen"
desc = "Rekordbox-Waveforms PWAV..PWV7 für die ANLZ-Dateien."
depends_on = ["analysis-engine", "anlz-writer"]
related = ["multiband-waveform-data"]
todo = ["Crossover vereinheitlichen: Engine jetzt 200 Hz / 2 kHz, services.py (250/2500) und src-tauri analysis.rs (250/4000) weichen ab - nur Anzeige, kein messbarer ANLZ-Effekt", "PWVC-Payload immer 0: Rekordbox' drei u16 folgen dem Band-Gain pro Track (Gain/PWVC fast konstant), Bedeutung nicht dokumentiert", "PWV2 r 0,89 (Median Orig-5) bleibt unter 0,9: Rekordbox' eigene PWAV erklären PWV2 auch nur zu 0,89", "PWV4 b1/b2 = 0 wie rbxport; Rekordbox b2 folgt dem Bass (r 0,99), b1 unbekannt (130..254)"]
notes = "Fix 2026-11-23 auf fix/waveform-format (tmp/wf-Harness, Konstanten an 11 Kalibrier-Tracks gefittet, 5 Holdout-Tracks nur geprüft): Amplituden-Korrelation zu Rekordbox, Median Orig-5 vorher -> nachher: PWAV 0,65->0,95, PWV2 0,45->0,89, PWV3 0,72->1,00, PWV4 0,70->0,96, PWV5 0,70->0,98, PWV6 0,62->0,96, PWV7 0,77->0,97; Holdout: 0,92 / 0,93 / 1,00 / 0,94 / 0,96 / 0,95 / 0,93. Höhe = 31*Peak^2, Vorschauen poolen, PWV7 Hüllkurve mit Release, Band-Gain pro Track; Wertebereiche wie Rekordbox; R=Bass, G=Mitte, B=Höhen. MP3-Vorlauf 0 / 25 / 51 ms je Info-Frame/LAME-Tag, sample-genau an 10 MP3s. Header/Einträge unverändert. Farbcheck am Player bleibt in cdj-hardware-validation."

