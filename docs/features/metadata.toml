[area]
id = "metadata"
name = "Metadaten & Tags"
order = 2
desc = "Track-Felder bearbeiten, Tags in Dateien schreiben, Namen bereinigen, Genres, Cover."

# ── Tag-Editing ───────────────────────────────────────────────────────────

[[feature]]
id = "track-metadata-update"
group = "Tag-Editing"
name = "Track-Metadaten speichern"
status = "shipped"
test = "getestet"
tested = "2026-11-14"
desc = "Felder einzeln oder als Batch in master.db bzw. XML schreiben."
paths = ["frontend/src/components/BatchEditBar.jsx"]
routes = ["/api/track/{tid}", "/api/tracks/batch"]
depends_on = ["live-master-db"]
related = ["file-tag-writeback"]
notes = "Kein eigenes Edit-Formular. BatchEditBar.jsx nicht gemountet. Unbekannte Feld-Keys werden still mit True quittiert (K8). Kern-Loop-Test 2026-11-14 (Stand PR #60 a71bfa7, Library-Kopie): ok."

[[feature]]
id = "track-write-safety"
group = "Tag-Editing"
parent = "track-metadata-update"
name = "Feld-Validierung + sichere Writes"
status = "partial"
test = "testen"
desc = "Felder ablehnen, die Live/XML nicht speichern kann; XML-Save atomar; 400/422 statt stillem 200."
paths = ["app/track_fields.py", "tests/test_track_metadata_fields.py", "tests/test_track_batch_writes.py"]
related = ["db-write-lock", "artist-merge", "rekordbox-write-backups", "phrase-db-writer"]
todo = ["Datei-Backup vor Tag-Writes (Revert stellt nur den Tag-String her)"]
notes = "PC-Test 2026-11-22: 13 verbotene Felder/Werte -> 400/422 ohne Änderung; gültige Edits ändern nur ihre Spalten. Routen-Teil (400/422/500 statt 200) aus dem alten Worktree wf_1fefdec9-6fc-2 (Branch claude/fix-track-metadata-fields) auf fix/kern-loop-backend-b12-b14 portiert; der alte Worktree ist danach überholt. Fix 2026-11-23 (fix/track-writes): PATCH /api/tracks/batch live alles-oder-nichts - alle IDs vor dem ersten Write gelesen, unbekannte -> 404 mit ID, nichts geschrieben; rbox-Fehler mittendrin -> schon geschriebene Zeilen aus Snapshots zurückgeschrieben, dann 500. POST /api/track/{tid} mit unbekannter ID -> 404 statt 500, XML-Modus ebenso. Fix 2026-11-25 (fix/backup-before-tag-writes): Artist-Merge apply + revert sichern vor dem ersten Write (auch vor create_artist) master.db + -wal + masterPlaylists6.xml als ein Satz neben master.db (phrase_db_writer.backup_master_db marker=.mergebak-, neueste 5 Sätze bleiben, unter db_lock). restore_master_db(path, backups, marker=.mergebak-) legt db + XML zusammen zurück; XML nur bei Datei master.db im Satz. Kopie scheitert -> MergeError, nichts geschrieben, kein Run. Satz-Dateinamen in Run-Note + Ergebnis (library_backup). Restore nicht an Route/UI (Revert bleibt Journal-Replay). Unit-Tests: tests/test_artist_merge_apply.py + tests/test_phrase_db_writer.py (tmp-Kopien)."

[[feature]]
id = "file-tag-writeback"
group = "Tag-Editing"
name = "Tags in Audiodatei schreiben"
status = "shipped"
test = "testen"
desc = "Mutagen schreibt ID3/FLAC/MP4/Vorbis/AIFF/WAV inkl. Cover (Setting write_tags_to_files)."
paths = ["app/audio_tags.py", "tests/test_track_batch_tags.py"]
depends_on = ["track-metadata-update"]
todo = ["Route mit write_tags_to_files=true nicht im PC-Test (nur write_tags direkt auf Kopien)"]
notes = "PC-Test 2026-11-22: write_tags auf Kopien in 5 Containern, Tags + Cover per mutagen zurückgelesen, PCM-md5 unverändert. src-tauri/src/audio/metadata.rs (lofty) ist toter Code. Fix 2026-11-23 (fix/track-writes): PATCH /api/tracks/batch schreibt jetzt dieselben Tags wie POST /api/track/{tid} (gemeinsames _file_tag_writeback in app/main.py, gleiches Setting + Cover), file_tags pro Track; Route-Tests auf tmp-Kopien (mp3/wav), nicht im PC-Test. Review-Fix: Edits betten das Library-Thumbnail nicht mehr ein (ersetzte das eigene Cover, löschte Back-Cover, PNG wurde image/jpeg); nur Felder mit Datei-Tag schreiben (ColorID allein / Streaming -> skipped, Datei unverändert); Tag-Writes pro Datei gesperrt und in master.db-Reihenfolge (audio_tags.FileWriteLocks)."

[[feature]]
id = "native-tag-read"
group = "Tag-Editing"
name = "Tags lesen beim Import"
status = "shipped"
test = "getestet"
tested = "2026-11-14"
desc = "Title/Artist/Album/BPM/Key/ISRC lesen, Fallback 'Artist - Title' aus Dateiname."
notes = "Lebt in app/audio_tags.py und app/services.py. Kern-Loop-Test 2026-11-14 (Stand PR #60 a71bfa7, Library-Kopie): ok."

