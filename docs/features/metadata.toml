notes = "Kein eigenes Edit-Formular. BatchEditBar.jsx nicht gemountet. Unbekannte Feld-Keys werden still mit True quittiert (K8). Kern-Loop-Test 2026-11-14 (Stand PR #60 a71bfa7, Library-Kopie): ok."

[[feature]]
id = "track-write-safety"
group = "Tag-Editing"
parent = "track-metadata-update"
name = "Feld-Validierung + sichere Writes"
status = "shipped"
test = "getestet"
tested = "2026-11-25"
desc = "Felder ablehnen, die Live/XML nicht speichern kann; XML-Save atomar; 400/422 statt stillem 200; Backups vor Merge und vor Tag-Writes."
paths = ["app/track_fields.py", "tests/test_track_metadata_fields.py", "tests/test_track_batch_writes.py"]
related = ["db-write-lock", "artist-merge", "rekordbox-write-backups", "phrase-db-writer", "file-tag-writeback"]
notes = "PC-Test 2026-11-22: 13 verbotene Felder/Werte -> 400/422 ohne Änderung; gültige Edits ändern nur ihre Spalten. Routen-Teil (400/422/500 statt 200) aus dem alten Worktree wf_1fefdec9-6fc-2 (Branch claude/fix-track-metadata-fields) auf fix/kern-loop-backend-b12-b14 portiert; der alte Worktree ist danach überholt. Fix 2026-11-23 (fix/track-writes): PATCH /api/tracks/batch live alles-oder-nichts - alle IDs vor dem ersten Write gelesen, unbekannte -> 404 mit ID, nichts geschrieben; rbox-Fehler mittendrin -> schon geschriebene Zeilen aus Snapshots zurückgeschrieben, dann 500. POST /api/track/{tid} mit unbekannter ID -> 404 statt 500, XML-Modus ebenso. Fix 2026-11-25 (fix/backup-before-tag-writes): Artist-Merge apply + revert sichern vor dem ersten Write (auch vor create_artist) master.db + -wal + masterPlaylists6.xml als ein Satz neben master.db (phrase_db_writer.backup_master_db marker=.mergebak-, neueste 5 Sätze bleiben, unter db_lock). restore_master_db(path, backups, marker=.mergebak-) legt db + XML zusammen zurück; XML nur bei Datei master.db im Satz. Kopie scheitert -> MergeError, nichts geschrieben, kein Run. Satz-Dateinamen in Run-Note + Ergebnis (library_backup). Restore nicht an Route/UI (Revert bleibt Journal-Replay). Unit-Tests: tests/test_artist_merge_apply.py + tests/test_phrase_db_writer.py (tmp-Kopien). Datei-Backup vor Tag-Writes 2026-11-25: siehe file-tag-writeback (app/tag_backups.py). PC-Test 2026-11-25 (Library-Kopie, 5041 Tracks, Rekordbox zu): artist_merge.apply(write_tags=False) auf kleinste Kandidatengruppe -> 1 Track umgehängt, Satz master.db + -wal + masterPlaylists6.xml angelegt, sha256 jedes Satzmitglieds = Stand vor dem Merge; restore_master_db(marker=.mergebak-) in frischem Prozess -> alle 3 Dateien byte-gleich zum Stand vor dem Merge. Echte master.db/XML unverändert (mtime 2026-11-22), keine .mergebak-Dateien im echten Ordner."

[[feature]]
id = "file-tag-writeback"
group = "Tag-Editing"
name = "Tags in Audiodatei schreiben"
status = "shipped"
test = "getestet"
tested = "2026-11-25"
desc = "Mutagen schreibt ID3/FLAC/MP4/Vorbis/AIFF/WAV inkl. Cover (Setting write_tags_to_files); Kopie vor dem ersten Write, Write atomar."
paths = ["app/audio_tags.py", "app/tag_backups.py", "tests/test_track_batch_tags.py", "tests/test_tag_backups.py"]
depends_on = ["track-metadata-update"]
notes = "PC-Test 2026-11-22: write_tags auf Kopien in 5 Containern, Tags + Cover per mutagen zurückgelesen, PCM-md5 unverändert. src-tauri/src/audio/metadata.rs (lofty) ist toter Code. Fix 2026-11-23 (fix/track-writes): PATCH /api/tracks/batch schreibt jetzt dieselben Tags wie POST /api/track/{tid} (gemeinsames _file_tag_writeback in app/main.py, gleiches Setting + Cover), file_tags pro Track; Route-Tests auf tmp-Kopien (mp3/wav), nicht im PC-Test. Review-Fix: Edits betten das Library-Thumbnail nicht mehr ein (ersetzte das eigene Cover, löschte Back-Cover, PNG wurde image/jpeg); nur Felder mit Datei-Tag schreiben (ColorID allein / Streaming -> skipped, Datei unverändert); Tag-Writes pro Datei gesperrt und in master.db-Reihenfolge (audio_tags.FileWriteLocks). Fix 2026-11-25 (fix/backup-before-tag-writes): jeder write_tags-Aufruf (Edit-Routen, Artist-Merge, Fixer, Download-Namen, Import) legt vor dem ERSTEN Tag-Write eine byte-genaue Kopie an: %APPDATA%/MusicLibraryManager/tag-write-backups/<sha1(pfad)[:20]>/<stamp><ext> + <stamp>.json (Originalpfad, size, mtime_ns, sha256, letzter eigener Write; app/tag_backups.py). Weitere Writes -> keine neue Kopie; Datei außerhalb der App geändert -> neue Generation. Deckel tag_backups.TAG_BACKUP_CAP_BYTES = 5 GiB, älteste Generation zuerst weg, die neue nie. Keine Kopie -> kein Write (False). Write atomar: mutagen schreibt in eine Temp-Kopie .lmstag-<hex>.tmp neben der Datei, fsync, os.replace; Fehler/Absturz/Kill mittendrin -> Original byte-gleich (Unit-Test mit os._exit), Temp-Rest ist .tmp, kein Auto-Import. Schreibgeschützte Datei -> False ohne Kopie. SC-Download schreibt ohne Kopie (backup=False, frische eigene Datei). /api/stream liest pro 1-MiB-Chunk neu geöffnet, sonst blockiert ein laufender Track das os.replace unter Windows. Restore: tag_backups.restore(path) (sha256-geprüft, atomar), an keiner Route/UI; Logzeilen op=tag_backup* ohne Pfad (key + ext). Unit-Tests tests/test_tag_backups.py: Kopie einmal pro Datei, Deckel prunet älteste, Fehler/Kill mitten im Write -> Original byte-gleich, Restore byte-genau für mp3/flac/m4a/aiff/wav (m4a braucht ffmpeg mit aac, sonst skip). PC-Test 2026-11-25 der echten Routen (in-process httpx ASGITransport, kein Port; APPDATA/LOCALAPPDATA/HOME auf Sandbox, settings.json write_tags_to_files=true): Library-Kopie (master.db + XML, ohne share/), 5 Zeilen (mp3 14 MB, flac 24 MB, m4a 9.5 MB, aiff 35 MB, wav 58 MB) auf Kopien echter Dateien umgebogen; aiff/wav vorher mit Test-Cover (Library hat keine AIFF/WAV mit Cover). POST /api/track/{tid} {Comment, Rating=4} je Track -> 200 written; PATCH /api/tracks/batch {Title, Artist, Album, Genre} alle 5 -> 200 written. Je Datei: Tags per mutagen zurückgelesen ok (inkl. Rating), master.db-Zeile aktualisiert, PCM-md5 (ffmpeg s16le) unverändert, Bilder unverändert (1 je Datei, sha256 gleich), genau 1 Backup nach POST und weiter 1 nach PATCH, Kopie + Manifest-sha256 = Datei vor dem ersten Write, keine .lmstag-Temp-Reste, tag_backups.restore -> Datei byte-gleich zum Original. Echte Quelldateien sha256 unverändert, echte master.db unverändert, kein echtes tag-write-backups angelegt. Zeit: erster Write inkl. Kopie 0.2 s (mp3) bis 1.0 s (58-MB-WAV) je Route-Call; Batch ohne neue Kopien 0.8 s für 5 Dateien (190 MB)."

