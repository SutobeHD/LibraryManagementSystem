[area]
id = "platform"
name = "Plattform, Sicherheit & Performance"
order = 12
desc = "Tauri-Runtime + Sidecar, Auth/Security, Logging, Config, Performance, Mobile, Release/CI, Linux/macOS."

# ── Desktop-Runtime ───────────────────────────────────────────────────────

[[feature]]
id = "tauri-sidecar-supervisor"
group = "Desktop-Runtime"
name = "Sidecar-Supervisor"
status = "shipped"
desc = "Startet die Python-Sidecar, fängt das Token aus stdout ab und filtert es, Kill bei Exit, Dev-Autospawn."
related = ["bearer-session-auth", "pyinstaller-backend-bundle"]
notes = "Code in src-tauri/src/main.rs (Hub)."

[[feature]]
id = "pyinstaller-backend-bundle"
group = "Desktop-Runtime"
name = "Backend-Bundle (PyInstaller)"
status = "shipped"
desc = "backend_entry + backend.spec -> RB_Backend-Binary als Tauri externalBin."
paths = ["backend_entry.py", "backend.spec"]
notes = "Sidecar-Name RB_Backend vs. rb-backend uneinheitlich (Linux-Doc)."

[[feature]]
id = "tauri-capabilities"
group = "Desktop-Runtime"
name = "Tauri-Capabilities"
status = "partial"
desc = "Rechte: shell (Sidecar-Spawn), dialog, fs read/write/mkdir."
paths = ["src-tauri/capabilities/main.json"]
notes = "shell:allow-execute steht auf main noch drin (main.json:19) - entfernt auf PR #58 (1af45ae)."

# ── Auth & Security ───────────────────────────────────────────────────────

[[feature]]
id = "bearer-session-auth"
group = "Auth & Security"
name = "Bearer-Session-Auth (Phase 1)"
status = "shipped"
research = "security-api-auth-hardening"
desc = "Token beim Boot, require_session auf allen Mutationen, Übergabe per stdout/Datei/dev-token."
paths = ["app/auth.py", "frontend/src/store/authStore.js", "tests/test_auth.py"]
depends_on = ["tauri-sidecar-supervisor"]
notes = "Token nie loggen. Rotiert nur bei Sidecar-Neustart. Test-Isolation: plain pytest überschreibt den echten Session-Token (Fix auf PR #58)."

[[feature]]
id = "safe-compare"
group = "Auth & Security"
name = "Constant-Time-Vergleich"
status = "shipped"
research = "security-secrets-compare-digest-codebase-audit"
desc = "safe_compare-Helper + require_session-Refactor."
paths = ["app/security_compare.py", "tests/test_security_compare.py"]

[[feature]]
id = "rate-limiter"
group = "Auth & Security"
name = "Token-Bucket Rate-Limit"
status = "shipped"
research = "security-rate-limit-design"
desc = "In-Process-Buckets, Loopback ausgenommen, 429 + Retry-After."
paths = ["app/rate_limit.py", "tests/test_rate_limit.py"]
notes = "Nur HIGH-Tier verdrahtet (shutdown/restart/sc-auth-token)."

[[feature]]
id = "cors-lockdown"
group = "Auth & Security"
name = "CORS-Lockdown"
status = "shipped"
research = "security-cors-allow-credentials-tightening"
desc = "Nur localhost/tauri-Origins, explizite Methoden, allow_credentials=False, kein Auth-Cookie."
notes = "Code in app/main.py. Cookie-Auth-PRs immer ablehnen."

[[feature]]
id = "audio-path-sandbox"
group = "Auth & Security"
name = "Pfad-Sandbox"
status = "shipped"
research = "security-api-file-reveal-sandbox"
desc = "validate_audio_path gegen ALLOWED_AUDIO_ROOTS (is_relative_to) + Endungs-Whitelist."
paths = ["tests/test_main_security.py", "tests/test_security_hotfixes.py"]
notes = "Code in app/main.py."

[[feature]]
id = "api-route-auth-model"
group = "Auth & Security"
name = "Separates Route-Auth-Modell"
status = "dropped"
research = "api-route-auth-model"
desc = "Eigenes Route-Auth-Konzept (Spin-off aus Downloader OQ-A)."
notes = "Ersetzt durch das ausgelieferte require_session."

[[feature]]
id = "paired-device-tokens"
group = "Auth & Security"
name = "Gepaarte Geräte-Tokens (Phase 2)"
status = "partial"
research = "security-mobile-paired-tokens-phase2"
desc = "Gehashter Device-Token-Store, One-Shot-QR-Pairing-Codes, require_session akzeptiert beide."
paths = ["app/auth_db.py", "app/pairing_store.py", "tests/test_pairing*.py", "tests/test_require_session.py"]
depends_on = ["bearer-session-auth"]
related = ["mobile-companion"]
todo = ["T4 /api/pairing/start + complete", "T5 Geräte-Liste + Revoke", "T6 Tauri-QR-Render", "T7 Settings-UI 'Paired Devices'"]

[[feature]]
id = "dependency-hardening-audit"
group = "Auth & Security"
name = "Dependency-Hardening + Audit"
status = "shipped"
desc = "Pins (==), lockfile-lint, Audit-Skripte, Threat-Model."
paths = ["scripts/security-audit.sh", "scripts/security-audit.ps1", ".npmrc", ".lockfile-lintrc.json", "docs/SECURITY.md", ".claude/commands/audit.md"]
related = ["dependency-security-bumps"]

# ── Logging ───────────────────────────────────────────────────────────────

[[feature]]
id = "log-path-redaction"
group = "Logging"
name = "Log/Error-Redaction"
