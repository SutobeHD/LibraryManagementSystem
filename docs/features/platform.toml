desc = "client_id/oauth_token aus jeder geloggten URL, jedem Param-Dict und jeder Exception entfernt."
paths = ["tests/test_soundcloud_log_redaction.py"]
related = ["sc-api-client", "log-path-redaction"]

# ── Infra ─────────────────────────────────────────────────────────────────

[[feature]]
id = "system-lifecycle-routes"
group = "Infra"
name = "Health/Heartbeat/Shutdown/Restart"
status = "shipped"
desc = "Health ohne Auth, Heartbeat alle 5 s, Shutdown/Restart mit Auth + Rate-Limit."
paths = ["tests/test_system_health.py"]
routes = ["/api/system/health", "/api/system/heartbeat", "/api/system/shutdown", "/api/system/restart"]
notes = "Heartbeat wird gespeichert, aber kein Watchdog wertet ihn aus."

[[feature]]
id = "config-platform-paths"
group = "Infra"
name = "Config / Plattform-Pfade"
status = "partial"
desc = "REKORDBOX_ROOT, FFMPEG_BIN, export/log/temp/music-Ordner; Auth-Dateien über platformdirs."
paths = ["app/config.py"]
related = ["linux-dj-workflow"]
notes = "REKORDBOX_ROOT nur über %APPDATA%; relative ./exports hängen vom cwd ab."

[[feature]]
id = "docker-deploy"
group = "Infra"
name = "Docker-Setup"
status = "partial"
desc = "Dockerfile für Backend + Frontend, docker-compose."
paths = ["Dockerfile.backend", "Dockerfile.frontend", "docker-compose.yml"]
notes = "Backend bindet im Container 127.0.0.1 (unerreichbar). HANDOVER 5.5 sagt: löschen."

