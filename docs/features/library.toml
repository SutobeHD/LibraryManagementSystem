status = "unmerged"
branch = "fix/rekordbox-filetype-codes"
desc = "Converter schreibt korrekte FileType-Codes (AIFF 12, WAV 11, FLAC 5)."
notes = "Basiert auf main. Mit PR #58 nur MAP.md-Konflikt (regen)."

[[feature]]
id = "format-converter-mp3-cbr"
