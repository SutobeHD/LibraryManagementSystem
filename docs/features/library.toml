[area]
id = "library"
name = "Library & Collection"
order = 1
desc = "Tracks browsen und suchen, Playlists, Bewertung, Import, Qualität und Format-Konvertierung."

# ── Browsen & Suchen ──────────────────────────────────────────────────────

[[feature]]
id = "track-table"
group = "Browsen & Suchen"
name = "Track-Tabelle"
status = "shipped"
desc = "Sortierbare Track-Liste: Spalten, Camelot-Key-Farben, Cover-Thumb, Drag, Kontextmenü."
paths = ["frontend/src/components/TrackTable.jsx"]
routes = ["/api/file/reveal"]
related = ["inline-rating-color", "collection-view", "list-context-menus", "perf-frontend-virtualization"]
notes = "Nicht virtualisiert (Perf-Hotspot). LibraryView.jsx ist ein toter Vorgänger."

[[feature]]
id = "collection-view"
group = "Browsen & Suchen"
name = "Collection & Token-Suche"
status = "shipped"
desc = "Ganze Library als Collection-Knoten, Suche mit bpm:/key:/genre:/year:/rating:, Track löschen."
routes = ["/api/library/tracks", "/api/track/{tid}", "/api/track/delete", "/api/tracks/move"]
depends_on = ["track-table", "live-master-db"]
notes = "/api/tracks/move ist ein Stub. /api/library/tracks ohne Pagination (siehe perf-backend-quickwins)."

[[feature]]
id = "category-browser"
group = "Browsen & Suchen"
name = "Artists/Labels/Albums-Browser"
status = "shipped"
desc = "Library nach Artist, Label, Album gruppiert, Track-Liste pro Eintrag."
paths = ["frontend/src/components/MetadataView.jsx"]
routes = ["/api/artists", "/api/artist/{aid}/tracks", "/api/labels", "/api/albums"]
depends_on = ["track-table", "name-normalisation"]
related = ["artist-hub"]
notes = "Auf PR #58 übernimmt der Artist Hub den Artists-Tab."

# ── Playlists ─────────────────────────────────────────────────────────────

[[feature]]
id = "playlist-tree-crud"
group = "Playlists"
name = "Playlist-Baum"
status = "shipped"
desc = "Ordner/Playlists anlegen, umbenennen, per Drag verschieben, duplizieren, löschen."
paths = ["frontend/src/components/PlaylistBrowser.jsx"]
routes = ["/api/playlists/tree", "/api/playlists/create", "/api/playlists/rename", "/api/playlists/move", "/api/playlists/delete"]
depends_on = ["live-master-db"]
related = ["standalone-library-mode"]

[[feature]]
id = "playlist-track-ops"
group = "Playlists"
name = "Tracks in Playlists (add/remove/reorder)"
status = "partial"
desc = "Track hinzufügen/entfernen, Drag-Reorder innerhalb der Playlist."
routes = ["/api/playlists/add-track", "/api/playlists/remove-track", "/api/playlists/reorder"]
depends_on = ["playlist-tree-crud", "db-write-lock"]
todo = ["Fix da6ba0d (falsche rbox-Arity bei remove/reorder) mit PR #58 landen", "Test-Playlist anlegen, Remove/Reorder real prüfen, wegräumen"]
notes = "Im Live-Modus auf main kaputt."

[[feature]]
id = "smart-playlists"
group = "Playlists"
name = "Smart Playlists"
status = "partial"
desc = "Regel-Editor (BPM/Key/Genre/Rating/Datum), Auswertung, Rekordbox-Intelligent-Playlists lesen."
paths = ["frontend/src/components/SmartPlaylistEditor.jsx", "app/smart_playlist_engine.py"]
routes = ["/api/playlists/smart"]
depends_on = ["playlist-tree-crud"]
notes = "Live-Modus hält Kriterien nur im RAM (_smart_overlay), nach Neustart weg."

[[feature]]
id = "auto-label-playlists"
group = "Playlists"
name = "Auto-Playlists nach Label"
status = "shipped"
desc = "Ordner 'By Label' mit einer Playlist pro Label ab Schwelle."
routes = ["/api/library/smart-playlists"]
depends_on = ["playlist-tree-crud"]
related = ["artist-projection-rekordbox", "library-folder-projections"]
notes = "main baut noch zusätzlich 'By Artist' (doppelt je Lauf). PR #58 legt das still."

[[feature]]
id = "library-folder-projections"
group = "Playlists"
name = "Ordner-Projektionen verallgemeinern"
status = "idea"
desc = "Artist-Ordner-Automatik auf Labels, Setlists, Genres übertragen (collection_kind)."
related = ["artist-projection-rekordbox", "sc-collection-sync", "genre-normalization"]

# ── Bewertung & Tags ──────────────────────────────────────────────────────

[[feature]]
id = "inline-rating-color"
group = "Bewertung & Tags"
name = "Rating & Farbe inline"
status = "shipped"
desc = "5-Sterne-Klick und Pioneer-Farbpicker direkt in der Tabelle."
routes = ["/api/tracks/batch"]
depends_on = ["track-metadata-update", "track-table"]

[[feature]]
id = "ranking-mode"
group = "Bewertung & Tags"
name = "Ranking-Modus"
status = "shipped"
desc = "Track für Track durchgehen: Rating, Farbe, Genre, Kommentar, MyTags; Filter unrated/untagged."
paths = ["frontend/src/components/RankingView.jsx"]
routes = ["/api/track/{tid}", "/api/track/{tid}/mytags", "/api/genres"]
depends_on = ["track-metadata-update", "mytag-management"]
related = ["mobile-companion"]
notes = "Springt auch bei fehlgeschlagenem Save weiter. 'Service Mark' ist ein Platzhalter."

[[feature]]
id = "ranking-genre-tree"
group = "Bewertung & Tags"
parent = "ranking-mode"
name = "Ranking-Tags als Genre-Baum"
status = "in_progress"
branch = "feat/artist-hub"
desc = "Tag-Chips als Genre > Sub-Genre sortiert, Tokens landen im Comment."
paths = ["frontend/src/config/tagTaxonomy.js", "frontend/src/config/tagTaxonomy.test.js"]
related = ["genre-normalization", "genre-definition-schema", "genre-atlas"]
notes = "f4cf807 (2026-10-25) nur auf feat/artist-hub, nicht in PR #58 - auf #58 cherry-picken (konfliktfrei)."

[[feature]]
id = "mytag-management"
group = "Bewertung & Tags"
name = "MyTags & Genres"
status = "shipped"
desc = "MyTag-Definitionen anlegen/löschen, pro Track setzen, Genre-Liste."
routes = ["/api/mytags", "/api/track/{tid}/mytags", "/api/genres"]
depends_on = ["live-master-db"]

# ── Import ────────────────────────────────────────────────────────────────

[[feature]]
id = "import-manager"
group = "Import"
name = "Import-Manager"
status = "shipped"
desc = "Drag-Drop/Ordner-Import, Ordner wird Playlist, 7-Stufen-Pipeline."
paths = ["frontend/src/components/ImportView.jsx", "app/import_tracker.py", "tests/test_import*.py"]
routes = ["/api/library/import-paths", "/api/audio/import", "/api/import/tasks"]
depends_on = ["native-tag-read", "analysis-on-import", "anlz-writer"]
related = ["download-manager-view", "import-progress-banner"]

[[feature]]
id = "import-quality-panel"
group = "Import"
parent = "import-manager"
name = "Import-Settings-Panel"
status = "partial"
desc = "Rechte Spalte im Import: Lossless/Lossy-Analyse, Zielformat, Safe-Delete."
notes = "/api/library/quality-stats fehlt (zeigt hart 1247/892). Zielformat und Backup gehen nie ans Backend."

[[feature]]
id = "folder-watcher"
group = "Import"
name = "Folder-Watcher & Ordner-Scan"
status = "shipped"
desc = "Überwachte Ordner automatisch importieren, einmaliger Scan."
paths = ["app/folder_watcher.py"]
routes = ["/api/library/folder-watcher", "/api/library/scan-folder"]
depends_on = ["import-manager"]

[[feature]]
id = "rekordbox-free-workflow-toggles"
group = "Import"
name = "Rekordbox-freier Workflow: Schalter"
status = "idea"
desc = "Auto-Import nach Download abschaltbar; Auto-XML-Export bei jedem Import entkoppeln."
related = ["rekordbox-xml-bridge", "usb-onelibrary-track-limit"]

# ── Qualität & Duplikate ──────────────────────────────────────────────────

[[feature]]
id = "duplicate-finder"
group = "Qualität & Duplikate"
name = "Duplikat-Finder"
status = "partial"
desc = "Scan, Gruppen, Master wählen, Playcounts mergen."
paths = ["frontend/src/components/DuplicateView.jsx"]
routes = ["/api/duplicates", "/api/tools/duplicates"]
related = ["rust-acoustic-fingerprint", "variant-detector"]
notes = "Fingerprint = MD5 auf 30 s PCM (Hamming darauf sinnlos). Rust-Fingerprint nie aufgerufen."

[[feature]]
id = "library-health-filters"
group = "Qualität & Duplikate"
name = "Library-Health-Filter"
status = "shipped"
desc = "Utilities-Tabs: Low Quality (Bitrate), Lost, No Cover."
paths = ["frontend/src/components/UtilitiesView.jsx"]
routes = ["/api/insights"]
related = ["quality-tiers-audit"]
notes = "'Lost' heißt PlayCount <= Schwelle, nicht fehlende Datei."

[[feature]]
id = "insights-dashboard"
group = "Qualität & Duplikate"
name = "Insights-Dashboard"
status = "partial"
desc = "DJ-Stil-Statistik: BPM/Key/Genre-Verteilung."
paths = ["frontend/src/components/InsightsView.jsx"]
notes = "/api/insights/dj_stats existiert nicht - läuft immer über den Client-Fallback."

[[feature]]
id = "quality-tiers-audit"
group = "Qualität & Duplikate"
name = "Qualitäts-Audit A-D"
status = "in_progress"
branch = "feat/artist-hub"
desc = "Ehrliche Qualitätskarte (Papier- + Spektral-Rating, schlechteres gewinnt) als Basis für das große Re-Format."
paths = ["scripts/dev/scan_audio_quality.py", "scripts/dev/rescan_unreadable.py"]
related = ["quality-upgrade-finder", "format-converter", "quality-settings-lossless-tagging", "library-health-filters"]
todo = ["Spektral-Messung für alle Tracks", "Flags konvertiert/aufgeblasen/prüfen + Spektrogramm + Override", "Re-Format-Plan"]
notes = "Tiers bestätigt 2026-10-24 (A Verlustfrei / B Club / C Notspielbar / D Unspielbar). Papier: A 301, B 4240, C 35, D 126. Scanner nur auf feat/artist-hub."

[[feature]]
id = "quality-upgrade-finder"
group = "Qualität & Duplikate"
name = "Quality-Upgrade-Finder"
status = "planned"
research = "library-quality-upgrade-finder"
desc = "Pro Track Qualität messen (ffprobe + Spektral-Cutoff, Transcode-Erkennung), bessere Quellen vorschlagen; Swap via Format-Converter."
paths = ["app/quality_engine.py", "tests/test_quality_engine.py"]
depends_on = ["external-track-match", "format-converter", "quality-tiers-audit"]
related = ["extended-remix-finder", "unified-downloader"]
todo = ["Verdict-Heuristik auf die Tiers A-D umstellen", "librosa 0.10.1 -> 0.11.0 (CVE-Check)", "Phase-1a probe + Route", "Phase-3 Swap via format-swap trigger=quality_verdict"]

[[feature]]
id = "quality-settings-lossless-tagging"
group = "Qualität & Duplikate"
name = "Quality-Settings + Lossless-Tag"
status = "research"
research = "quality-settings-lossless-tagging"
branch = "claude/dreamy-taussig-5d11c4"
desc = "Download-Qualitätspräferenzen (Lossless bevorzugen / Hi-Res) + eindeutige Lossless-Markierung."
related = ["quality-tiers-audit", "quality-upgrade-finder", "unified-downloader"]
notes = "Doc nur auf Branch, State ideagate_ gibt es nicht mehr. Überlappt mit Tiers A-D."

# ── Format-Konvertierung ──────────────────────────────────────────────────

[[feature]]
id = "format-converter"
group = "Format-Konvertierung"
name = "Format-Converter (Library-weit)"
status = "partial"
research = "library-format-converter"
desc = "m4a/mp3 -> AIFF/FLAC/WAV/MP3 in place, content_id bleibt (Cues/Grid/Playlists), Dry-Run, Rollback, Export-Kopien."
paths = ["frontend/src/components/FormatConverterView.jsx", "frontend/src/components/format-swap/", "app/library_format_swap.py", "scripts/dev/safe_format_swap.py", "tests/test_library_format_swap.py"]
routes = ["/api/library/format-swap"]
depends_on = ["live-master-db", "db-write-lock", "rekordbox-running-guard", "rekordbox-write-backups", "ffmpeg-resolver"]
related = ["quality-upgrade-finder", "download-format-setting", "hardwerk-format-copies"]
