[area]
id = "usb"
name = "USB / CDJ-Export"
order = 6
desc = "Sticks erkennen, Profile, OneLibrary + Legacy-PDB schreiben, ANLZ/Artwork, Sync, Hardware-Settings. Byte-Invarianten: app/usb_pdb.py."

# ── Geräte & Profile ──────────────────────────────────────────────────────

[[feature]]
id = "usb-device-detect"
group = "Geräte & Profile"
name = "USB-Erkennung"
status = "shipped"
test = "testen"
desc = "Nur Wechsel-Sticks, Rekordbox-Stick erkennen, Speicherbalken, Kompatibilitäts-Matrix."
paths = ["frontend/src/components/usb/UsbDeviceList.jsx", "frontend/src/components/UsbView.jsx"]
routes = ["/api/usb/devices"]
related = ["linux-dj-workflow"]
todo = ["USB-Ansicht öffnen: GET /api/usb/devices 4,6 s, /api/usb/profiles 7,5 s (gemessen 2026-11-08 auf dem Stand vor PR #70)"]
notes = "Windows-only (PowerShell Get-Disk)."

[[feature]]
id = "usb-profiles"
group = "Geräte & Profile"
name = "USB-Profile & Inhalt"
status = "shipped"
test = "testen"
desc = "Profil pro Stick (Label, Typ, Format), Playlist-Auswahl, Stick-Inhalt durchsuchen."
paths = ["frontend/src/components/settings/SettingsUsb.jsx", "frontend/src/components/usb/UsbProfileEditor.jsx"]
routes = ["/api/usb/profiles", "/api/usb/rename", "/api/usb/{device_id}/contents"]
depends_on = ["usb-device-detect"]

[[feature]]
id = "usb-drive-tools"
group = "Geräte & Profile"
name = "Eject / Reset / Init / Format"
status = "shipped"
test = "testen"
desc = "Auswerfen, Library zurücksetzen, als Rekordbox-Stick initialisieren, FAT32/exFAT-Wizard mit Systemlaufwerk-Sperre."
paths = ["frontend/src/components/usb/UsbFormatWizard.jsx", "frontend/src/components/usb/UsbControls.jsx"]
routes = ["/api/usb/eject", "/api/usb/reset", "/api/usb/initialize", "/api/usb/format"]
depends_on = ["usb-device-detect"]

# ── Export-Formate ────────────────────────────────────────────────────────

[[feature]]
id = "usb-sync-engine"
group = "Export-Formate"
name = "USB-Sync & Diff"
status = "shipped"
test = "testen"
desc = "Collection/Playlists auf den Stick, Diff-Vorschau, Lock-File, atomare Kopie, Legacy rekordbox.xml."
paths = ["app/usb_manager.py", "frontend/src/components/usb/UsbSyncPanel.jsx", "tests/test_usb_*.py"]
routes = ["/api/usb/sync", "/api/usb/sync/all", "/api/usb/diff", "/api/usb/history"]
depends_on = ["usb-profiles", "usb-onelibrary-export"]
related = ["performance-overhaul"]
todo = ["App-Start ohne Stick: POST /api/usb/initialize für fehlendes E:\\ läuft wiederholt in 500 (WinError 3) - fehlendes Laufwerk sauber als 'nicht verbunden' melden"]
notes = "Blockierender POST mit Fake-Progress (offen). Scan/Diff-N+1 seit PR #70 (in #60) behoben. Altfund: exportLibrary.db wird mit plain sqlite3 gelesen, Stick-Seite der Diff leer, Datei bei jedem Sync-Start gelöscht. Kern-Loop-Test 2026-11-14 (Stand PR #60 a71bfa7, Library-Kopie): B7 (.lms_anlz im Musikordner, Rekordbox-Analyse ignoriert) in PR #82 gefixt - neu prüfen."

[[feature]]
id = "usb-onelibrary-export"
group = "Export-Formate"
name = "OneLibrary exportLibrary.db"
status = "partial"
test = "testen"
desc = "PIONEER/rekordbox/exportLibrary.db über Template-DB - Rekordbox 6/7 erkennt den Stick."
paths = ["app/usb_one_library.py", "app/templates/", "tests/test_onelibrary_wal_flush.py"]
depends_on = ["usb-anlz-export", "usb-artwork"]
notes = "Template-Hack, weil rbox create_content in 0.1.7 kaputt ist. Slots wachsen über 16 hinaus (usb-onelibrary-track-limit). Playlist-Links seit fix/usb-onelibrary-track-limit lückenlos nummeriert - vorher leerte ein fehlender Track den Rest der Playlist. Kern-Loop-Test 2026-11-14 (Stand PR #60 a71bfa7, Library-Kopie): bpmx100=0/length=0 auf dem Stick (Folge von B4) in PR #82 gefixt - neu prüfen."

[[feature]]
id = "usb-onelibrary-track-limit"
group = "Export-Formate"
parent = "usb-onelibrary-export"
name = "16-Track-Grenze aufheben"
status = "shipped"
test = "testen"
research = "usb-onelibrary-track-limit"
desc = "Stick-Export schreibt alle gewählten Tracks in exportLibrary.db und export.pdb (vorher max. 16 Template-Slots, B9)."
paths = ["tests/test_onelibrary_track_limit.py"]
related = ["pyrekordbox-upgrade", "rbox-upgrade", "rekordbox-free-workflow-toggles"]
notes = "B9 belegt 2026-11-14: 20-Track-Playlist -> exportLibrary.db und export.pdb je 16 Zeilen, rekordbox.xml 20; gefixt in PR #88 (gemergt 2026-11-22), Prüfung am CDJ: cdj-hardware-validation. Template-Slots wachsen zur Laufzeit (rbox 0.1.7: create_content-Halbzeile + update_content-Reparatur, _grow_slots). Scheitert das, alte 16er-Kappung mit Warnung. Neue Slots erben Template-Spalten (Datum, Samplerate, master ids) wie die 16 alten - master_content_id wiederholt sich alle 16 Zeilen. ~500-Track-PDB-Limit unbelegt (Docstring-Annahme, kein Writer-Limit). Langfristig DB aus Schema bauen wie rbxport: docs/reference/rbxport/export.md §3."

[[feature]]
id = "cdj-hardware-validation"
group = "Validierung"
name = "Hardware-Test am CDJ-3000"
status = "shipped"
test = "testen"
desc = "Abnahme am echten Player: Stick aus der App laden und am CDJ-3000 prüfen. Checkliste und Track-Auswahl: python scripts/validate_real_world.py checklist."
depends_on = ["analysis-real-world-validation", "usb-onelibrary-export"]
related = ["usb-onelibrary-track-limit", "usb-legacy-pdb"]
todo = ["Tempo und Länge am Player wie in der App", "Cover und Waveform (Übersicht + Zoom) sichtbar", "Grid sitzt auf dem Kick: Anfang, Mitte, Ende (B5)", "Hot Cues und Memory Cues an der richtigen Stelle", "Sync-Drift: zwei Tracks 5 Minuten im Beat-Sync", "Stick mit mehr als 16 Tracks: alle Tracks und Playlists da (B9)", "Hot-Cue-Bänke A..P am Player (nach Merge von hot-cue-16-limits)", "AIFF aus dem SC-Download (AIFF-C sowt) spielt am Player", "Waveform-Farben am Player wie in Rekordbox", "Legacy export.pdb lädt an einem alten CDJ"]
notes = "Zurückgestellt 2026-11-22 (Nutzer): Tests mit externer Hardware erst in einer späteren Phase. Bis dahin zählt für die einzelnen Features der Test am PC. Kein eigener Code - die Checkliste gehört zu analysis-real-world-validation."

[[feature]]
id = "usb-legacy-pdb"
group = "Export-Formate"
name = "Legacy export.pdb (alte CDJs)"
status = "partial"
test = "testen"
desc = "export.pdb + exportExt.pdb nach Crate-Digger-Spec, byte-verifiziert gegen echten Stick."
paths = ["app/usb_pdb.py", "tests/test_pdb_structure.py"]
depends_on = ["usb-onelibrary-export"]
notes = "Default an (usb_write_legacy_pdb=True in usb_manager), kein UI-Toggle. ~500-Track-Grenze unbelegt (Docstring-Annahme). Datenseiten max. 255 Zeilen (MAX_ROWS_PER_PAGE), damit nie der unverifizierte >255-Zeilen-Header entsteht. rbxport-Abweichungen (UTF-16 ohne Terminator + 4-Byte-Align, >255-Zeilen-Header, Tabellen 16-19): docs/reference/rbxport/export.md §10-11. Kern-Loop-Test 2026-11-14 (Stand PR #60 a71bfa7, Library-Kopie): ok."

[[feature]]
id = "usb-anlz-export"
group = "Export-Formate"
name = "ANLZ auf den Stick"
status = "shipped"
test = "testen"
desc = "USBANLZ/<bucket>/ANLZ0000.DAT/EXT/2EX pro Track, kopieren oder neu erzeugen."
depends_on = ["anlz-writer"]
notes = "Lebt in usb_one_library.py + anlz_sidecar.py. Quellen: 1) Rekordbox-ANLZ aus AnalysisDataPath (Live), 2) LMS-ANLZ-Cache im User-Cache-Ordner (alte .lms_anlz neben der Audiodatei nur lesend), 3) frische Analyse in den Cache - nie in den Musikordner (B7, fix/kernloop-0.1-bugs). rbxport: CDJ-3000 leitet USBANLZ-Ordner aus Hash des USB-Pfads ab (wir: aus content id) - docs/reference/rbxport/export.md §4. Kern-Loop-Test 2026-11-14 (Stand PR #60 a71bfa7, Library-Kopie): B7 (Rekordbox-ANLZ nie als Quelle) in PR #82 gefixt - neu prüfen."

[[feature]]
id = "usb-anlz-export-fixes"
group = "Export-Formate"
parent = "usb-anlz-export"
name = "ANLZ-Export-Fixes (PPTH/PSSI)"
status = "shipped"
test = "getestet"
tested = "2026-11-14"
desc = "Stick-PPTH + maskiertes PSSI, explizite Suffixe, Stale-Cleanup, djmdCue kind/comment korrekt lesen."
paths = ["app/anlz_usb_export.py", "tests/test_anlz_usb_export*.py", "tests/test_live_cue_loading.py"]
related = ["usb-export-manual-cues"]
notes = "Auf origin gepusht, in den Integrations-Branch gemergt. Kern-Loop-Test 2026-11-14 (Stand PR #60 a71bfa7, Library-Kopie): ok."

[[feature]]
id = "usb-export-manual-cues"
group = "Export-Formate"
name = "Manuelle Cues auf den Stick"
status = "idea"
desc = "Manuell gesetzte Cues/Grids/Hot-Loops übernehmen statt neu zu analysieren."
related = ["rekordbox-cue-beatgrid-write", "usb-anlz-export-fixes"]
notes = "Bug K5: _generate_or_copy_anlz_for liest keine position_marks. Evtl. teilweise durch usb-anlz-export-fixes (ungeprüft)."

[[feature]]
id = "usb-artwork"
group = "Export-Formate"
name = "Cover auf den Stick"
status = "partial"
test = "testen"
desc = "Eingebettetes Cover oder cover.jpg nach PIONEER/Artwork (klein + mittel)."
paths = ["app/usb_artwork.py", "tests/test_usb_artwork.py"]
todo = ["_bucket_for: id 1 -> 00001 (Referenz-Stick), nicht 00000"]
notes = "rbxport nutzt id//20+1; docs/reference/rbxport/export.md §5. Pillow==13.0.0 jetzt in requirements.txt + backend.spec (Build bricht ohne ab); vorher blieb PIONEER/Artwork leer (B8, fix/kernloop-0.1-bugs). Kern-Loop-Test 2026-11-14 (Stand PR #60 a71bfa7, Library-Kopie): B8 (Pillow fehlte, 0 Cover) in PR #82 gefixt - neu prüfen."

[[feature]]
id = "usb-folder-relocation"
group = "Export-Formate"
name = "Stick-Dateien verschieben statt kopieren"
status = "shipped"
test = "testen"
desc = "Nach Artist-Rename die Datei auf dem Stick verschieben (Case-Rename in 2 Schritten, Content-Hash als Beweis)."
paths = ["tests/test_usb_relocate.py"]
depends_on = ["usb-onelibrary-export"]
related = ["artist-merge"]

