[[feature]]
id = "usb-artwork"
group = "Export-Formate"
name = "Cover auf den Stick"
status = "partial"
test = "getestet"
tested = "2026-11-25"
desc = "Library-Cover (master.db ImagePath), sonst eingebettetes Cover, sonst cover.jpg nach PIONEER/Artwork (klein + mittel)."
paths = ["app/usb_artwork.py", "tests/test_usb_artwork.py", "tests/test_usb_artwork_resync.py"]
depends_on = ["artwork-serve-embed"]
todo = ["Mittleres Bild: unser F:-Stick zeigt ~500x500, rbxport-Referenz 240x240 - an einem echten Rekordbox-Export klären (bisher 500 gelassen)"]
notes = "Cover aus der Library gefixt (fix/usb-artwork-library-cover, 2026-11-25): Reihenfolge jetzt Library-Cover (ImagePath, gleicher Resolver wie GET /api/artwork: app/library_artwork.py) -> eingebettet -> cover.jpg/folder.jpg; ein Bild, das nicht dekodiert, fällt zur nächsten Quelle durch. export.pdb liest dieselben image-Zeilen. PC-Test auf Kopie der Library (4909 lokale Tracks, 4680 mit Library-Cover; Vergleich dekodierter 24x24-Thumbnails): eingebettet vs Library nie verschieden (1748/1748 gleich), aber die alte Reihenfolge nahm bei 899 Tracks ein Ordner-Cover (cover.jpg/folder.jpg) statt des Library-Covers und bei 39 gar keins; 161 Tracks ohne Library-Cover bekommen weiter eingebettet/Ordner-Cover (so gewollt). 40-Track-Export nach %TEMP% (16 Ordner-Cover-Fälle, 8 gleich, 5 ohne Datei-Cover, 8 Fallbacks, 3 ohne Cover): vorher 8/29 Library-Cover richtig, 16 falsch, 5 fehlten; nachher 29/29 richtig, 8/8 Fallbacks = alte Quelle, 37/37 Pfade in export.pdb, Re-Sync 148/148 Dateien unverändert. Import-Cover lagen außerhalb des Resolver-Jails (%APPDATA%/Pioneer/app/data/covers); gefixt in fix/import-cover-dir (2026-11-25, siehe artwork-serve-embed). PC-Test 2026-11-22: B8 gefixt - beide JPEGs je Track, dekodierbar, 80x80, DB verweist darauf. rbxport nutzt id//20+1; docs/reference/rbxport/export.md §5. Pillow==13.0.0 jetzt in requirements.txt + backend.spec (Build bricht ohne ab); vorher blieb PIONEER/Artwork leer (B8, fix/kernloop-0.1-bugs). Kern-Loop-Test 2026-11-14 (Stand PR #60 a71bfa7, Library-Kopie): B8 (Pillow fehlte, 0 Cover) in PR #82 gefixt - neu prüfen. Cover-Ordner gefixt (fix/usb-export-data): 20 Bilder pro Ordner ab 00001, dazu b-Kopien wie Rekordbox; PC-Test: 40 Cover in 00001-00003, je a/a_m/b/b_m. Re-Sync-Cover gefixt (fix/usb-extras): PIONEER/Artwork/.lms-artwork.json merkt pro Bild-id den Hash des Quellbilds - neu schreiben nur bei anderem Hash, Cover nicht mehr benutzter ids werden nach dem Sync gelöscht; Track ohne Cover erbt kein altes mehr."

