# ── Export-Formate ────────────────────────────────────────────────────────

[[feature]]
id = "usb-sync-engine"
group = "Export-Formate"
name = "USB-Sync & Diff"
status = "shipped"
test = "getestet"
tested = "2026-11-23"
desc = "Collection/Playlists auf den Stick, Diff-Vorschau, Lock-File, atomare Kopie, Legacy rekordbox.xml."
paths = ["app/usb_manager.py", "frontend/src/components/usb/UsbSyncPanel.jsx", "tests/test_usb_*.py"]
routes = ["/api/usb/sync", "/api/usb/sync/all", "/api/usb/diff", "/api/usb/history"]
depends_on = ["usb-profiles", "usb-onelibrary-export"]
related = ["performance-overhaul"]
todo = ["App-Start ohne Stick: POST /api/usb/initialize für fehlendes E:\\ läuft wiederholt in 500 (WinError 3) - fehlendes Laufwerk sauber als 'nicht verbunden' melden"]
notes = "PC-Test 2026-11-22: erster Sync 38 Tracks/680 MB in 10 s, alle sha256 gleich, FAT32-Pfadlimit behandelt; Re-Syncs kopieren 0 Audio. Blockierender POST mit Fake-Progress (offen). Scan/Diff-N+1 seit PR #70 (in #60) behoben. Altfund: exportLibrary.db wird mit plain sqlite3 gelesen, Stick-Seite der Diff leer, Datei bei jedem Sync-Start gelöscht. Kern-Loop-Test 2026-11-14 (Stand PR #60 a71bfa7, Library-Kopie): B7 (.lms_anlz im Musikordner, Rekordbox-Analyse ignoriert) in PR #82 gefixt - neu prüfen. Re-Sync gefixt (fix/usb-resync, 2026-11-23): keine sqlite3-Probe der SQLCipher-DB mehr, gesperrte DB -> klarer Fehler, jede fehlgeschlagene Stufe -> Sync meldet 'Sync incomplete'. PC-Test mit Stick-Ordner: Sync A 38/38, Sync A+B 41/41 in exportLibrary.db und export.pdb, Diff danach 0. Diff liest den Stick per rbox und vergleicht die gewählten Playlists samt Ordnern."

[[feature]]
id = "usb-onelibrary-export"
group = "Export-Formate"
name = "OneLibrary exportLibrary.db"
status = "partial"
test = "testen"
desc = "PIONEER/rekordbox/exportLibrary.db über Template-DB - Rekordbox 6/7 erkennt den Stick."
paths = ["app/usb_one_library.py", "app/templates/", "tests/test_onelibrary_wal_flush.py"]
depends_on = ["usb-anlz-export", "usb-artwork"]
todo = ["Ordner nur in Groß/Kleinschreibung verschieden (Stenoz/STENOZ): rekordbox.xml-Pass verschiebt Datei, 3 DB-Pfade passen danach nicht", "Template-Reste: 13 leere Artists, 10 unbenutzte Keys"]
notes = "PC-Test 2026-11-22: Zeilen, numberOfContents, bpm, Länge, Titel/Artist/Key/Genre/Jahr, Playlist-Reihenfolge korrekt (38 und 328 Tracks). Template-Hack, weil rbox create_content in 0.1.7 kaputt ist. Slots wachsen über 16 hinaus (usb-onelibrary-track-limit). Playlist-Links seit fix/usb-onelibrary-track-limit lückenlos nummeriert - vorher leerte ein fehlender Track den Rest der Playlist. Kern-Loop-Test 2026-11-14 (Stand PR #60 a71bfa7, Library-Kopie): bpmx100=0/length=0 auf dem Stick (Folge von B4) in PR #82 gefixt - neu prüfen. BPM wird auf dem Stick gerundet statt abgeschnitten (fix/usb-resync, auch export.pdb). Exportfelder gefixt (fix/usb-export-data, 2026-11-23): Album, Dateityp, Samplerate, Bittiefe, Dateigröße aus der Datei, Bewertung 0..5 statt x51. PC-Test 41 echte Tracks: alle Felder = Datei/Library, export.pdb gleich."

[[feature]]
id = "usb-onelibrary-track-limit"
group = "Export-Formate"
parent = "usb-onelibrary-export"
name = "16-Track-Grenze aufheben"
status = "shipped"
test = "getestet"
tested = "2026-11-22"
research = "usb-onelibrary-track-limit"
desc = "Stick-Export schreibt alle gewählten Tracks in exportLibrary.db und export.pdb (vorher max. 16 Template-Slots, B9)."
paths = ["tests/test_onelibrary_track_limit.py"]
related = ["pyrekordbox-upgrade", "rbox-upgrade", "rekordbox-free-workflow-toggles"]
notes = "PC-Test 2026-11-22 (Stick-Ordner statt Stick, Kopie der Library): 38/38/38 und 328/328/328 Zeilen in exportLibrary.db, export.pdb, rekordbox.xml; 328 Tracks (8,1 GB) in 34 s, keine Kappungs-Warnung (B9). B9 belegt 2026-11-14: 20-Track-Playlist -> exportLibrary.db und export.pdb je 16 Zeilen, rekordbox.xml 20; gefixt in PR #88 (gemergt 2026-11-22), Prüfung am CDJ: cdj-hardware-validation. Template-Slots wachsen zur Laufzeit (rbox 0.1.7: create_content-Halbzeile + update_content-Reparatur, _grow_slots). Scheitert das, alte 16er-Kappung mit Warnung. Neue Slots erben Template-Spalten (Datum, Samplerate, master ids) wie die 16 alten - master_content_id wiederholt sich alle 16 Zeilen. ~500-Track-PDB-Limit unbelegt (Docstring-Annahme, kein Writer-Limit). Langfristig DB aus Schema bauen wie rbxport: docs/reference/rbxport/export.md §3."

[[feature]]
id = "cdj-hardware-validation"
group = "Validierung"
name = "Hardware-Test am CDJ-3000"
status = "shipped"
test = "testen"
desc = "Abnahme am echten Player: Stick aus der App laden und am CDJ-3000 prüfen. Checkliste und Track-Auswahl: python scripts/validate_real_world.py checklist."
depends_on = ["analysis-real-world-validation", "usb-onelibrary-export"]
related = ["usb-onelibrary-track-limit", "usb-legacy-pdb"]
todo = ["Tempo und Länge am Player wie in der App", "Cover und Waveform (Übersicht + Zoom) sichtbar", "Grid sitzt auf dem Kick: Anfang, Mitte, Ende (B5)", "Hot Cues und Memory Cues an der richtigen Stelle", "Sync-Drift: zwei Tracks 5 Minuten im Beat-Sync", "Stick mit mehr als 16 Tracks: alle Tracks und Playlists da (B9)", "Hot-Cue-Bänke A..P am Player (nach Merge von hot-cue-16-limits)", "AIFF aus dem SC-Download (AIFF-C sowt) spielt am Player", "Waveform-Farben am Player wie in Rekordbox", "Legacy export.pdb lädt an einem alten CDJ", "Grid-Phase nach Gehör/am Player: War Cry, Heimweh, City's Sleep, If I Only Knew - liegt LMS oder Rekordbox auf dem Kick?"]
notes = "Zurückgestellt 2026-11-22 (Nutzer): Tests mit externer Hardware erst in einer späteren Phase. Bis dahin zählt für die einzelnen Features der Test am PC. Kein eigener Code - die Checkliste gehört zu analysis-real-world-validation."

[[feature]]
id = "usb-legacy-pdb"
group = "Export-Formate"
name = "Legacy export.pdb (alte CDJs)"
status = "partial"
test = "getestet"
tested = "2026-11-23"
desc = "export.pdb + exportExt.pdb nach Crate-Digger-Spec, byte-verifiziert gegen echten Stick."
paths = ["app/usb_pdb.py", "tests/test_pdb_structure.py"]
depends_on = ["usb-onelibrary-export"]
notes = "PC-Test 2026-11-22: Struktur korrekt (57/96 Seiten, Ketten, Flags pro Tabelle, Unicode inkl. CJK/Griechisch, lückenlose Playlists, exportExt.pdb 9 Tabellen). Default an (usb_write_legacy_pdb=True in usb_manager), kein UI-Toggle. ~500-Track-Grenze unbelegt (Docstring-Annahme). Datenseiten max. 255 Zeilen (MAX_ROWS_PER_PAGE), damit nie der unverifizierte >255-Zeilen-Header entsteht. rbxport-Abweichungen (UTF-16 ohne Terminator + 4-Byte-Align, >255-Zeilen-Header, Tabellen 16-19): docs/reference/rbxport/export.md §10-11. Kern-Loop-Test 2026-11-14 (Stand PR #60 a71bfa7, Library-Kopie): ok. Track-Zeilen tragen jetzt Dateityp, Samplerate, Bittiefe, Dateigröße und Bewertung der echten Datei (fix/usb-export-data). Doku-Drift behoben (2026-11-23): coding-rules.md nennt jetzt die Regeln pro Tabelle (Flags 0x34/0x24, eigene Blank-Page als Ketten-Ende)."

[[feature]]
id = "usb-anlz-export"
group = "Export-Formate"
name = "ANLZ auf den Stick"
status = "shipped"
test = "getestet"
tested = "2026-11-22"
desc = "USBANLZ/<bucket>/ANLZ0000.DAT/EXT/2EX pro Track, kopieren oder neu erzeugen."
depends_on = ["anlz-writer"]
notes = "PC-Test 2026-11-22 (Stick-Ordner statt Stick, Kopie der Library): 366 Tracks: DAT/EXT/2EX, PPTH = Stick-Pfad, Beatgrids und Cue-Anzahl gleich den Rekordbox-ANLZ, übrige Tags byte-gleich. Lebt in usb_one_library.py + anlz_sidecar.py. Quellen: 1) Rekordbox-ANLZ aus AnalysisDataPath (Live), 2) LMS-ANLZ-Cache im User-Cache-Ordner (alte .lms_anlz neben der Audiodatei nur lesend), 3) frische Analyse in den Cache - nie in den Musikordner (B7, fix/kernloop-0.1-bugs). rbxport: CDJ-3000 leitet USBANLZ-Ordner aus Hash des USB-Pfads ab (wir: aus content id) - docs/reference/rbxport/export.md §4. Kern-Loop-Test 2026-11-14 (Stand PR #60 a71bfa7, Library-Kopie): B7 (Rekordbox-ANLZ nie als Quelle) in PR #82 gefixt - neu prüfen."

