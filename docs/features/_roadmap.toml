# Versionsplan: welches Feature gehört (fertig + getestet) zu welcher Version.
# Schema + Workflow: .claude/rules/feature-map.md, Abschnitt "Roadmap".
# Ansicht: python scripts/feature_map.py --roadmap [--release <id>]  |  Mindmap -> Tab "Roadmap"
#
# Eine Version ist
#   testbar   = alle ihre Features liegen auf main (Vorhanden / Teilweise)
#   erreicht  = alle ihre Features sind getestet (test = "getestet")
# Jedes Feature steht in höchstens einer Version. Verworfene nie.
# Features ohne Version = "Ungeplant" (außer Bereichen in unversioned_areas).
# Reihenfolge der [[release]]-Blöcke = Reihenfolge der Versionen.
#
# Stufen: alpha = Features kommen noch dazu, darf wackeln
#         beta  = Feature-Freeze: nur noch Stabilität, Tempo, Sicherheit, Feinschliff
#         rc / release = Release-Kandidat / öffentliche Version
#         later = nach 1.0, bewusst zurückgestellt

# Entwickler-Werkzeuge sind kein Teil der App: brauchen keine Version.
unversioned_areas = ["devtools"]

